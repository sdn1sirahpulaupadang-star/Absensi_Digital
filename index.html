<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxP2x0u4_Z-nM_4rc46H0J2rJFvZwSJQsBkdTEjaY4DPW2eSa61VJoxyU4PnjBaU2TA/exec";

    let currentStudents = [];
    let attendanceState = {};

    window.onload = function() {
      populateDays();
      autoSelectToday();
    };

    function switchTab(tabName) {
      document.getElementById("tabAttendance").classList.add("hidden");
      document.getElementById("tabScanner").classList.add("hidden");
      document.getElementById("tabIdCards").classList.add("hidden");

      document.getElementById("tabBtnAttendance").className = "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-800 flex items-center gap-1.5";
      document.getElementById("tabBtnScanner").className = "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-800 flex items-center gap-1.5";
      document.getElementById("tabBtnIdCards").className = "px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-800 flex items-center gap-1.5";

      if (tabName === 'attendance') {
        document.getElementById("tabAttendance").classList.remove("hidden");
        document.getElementById("tabBtnAttendance").className = "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-blue-600 shadow-sm flex items-center gap-1.5";
      } else if (tabName === 'scanner') {
        document.getElementById("tabScanner").classList.remove("hidden");
        document.getElementById("tabBtnScanner").className = "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-blue-600 shadow-sm flex items-center gap-1.5";
        updateScannerInfo();
        setTimeout(() => document.getElementById("quickNisInput").focus(), 200);
      } else if (tabName === 'idcards') {
        document.getElementById("tabIdCards").classList.remove("hidden");
        document.getElementById("tabBtnIdCards").className = "px-3 py-1.5 rounded-lg text-xs font-bold transition bg-white text-blue-600 shadow-sm flex items-center gap-1.5";
        renderIdCards();
      }
    }

    function togglePassVisibility() {
      const input = document.getElementById("passwordInput");
      const icon = document.getElementById("passEyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.className = "fa-solid fa-eye-slash";
      } else {
        input.type = "password";
        icon.className = "fa-solid fa-eye";
      }
    }

    // 1. FUNGSI PEMANGGIL DATA LOGIN
    function handleLogin(e) {
      e.preventDefault();
      const pass = document.getElementById("passwordInput").value;
      const btn = document.getElementById("btnLogin");
      const err = document.getElementById("loginError");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...`;
      err.classList.add("hidden");

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "verifyLogin", password: pass })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk Portal Aplikasi</span><i class="fa-solid fa-arrow-right"></i>`;
        if (res.success) {
          document.getElementById("loginModal").classList.add("hidden");
          loadStudentCards();
        } else {
          err.textContent = res.message;
          err.classList.remove("hidden");
        }
      })
      .catch(e => {
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk Portal Aplikasi</span><i class="fa-solid fa-arrow-right"></i>`;
        err.textContent = "Koneksi API Gagal: " + e.message;
        err.classList.remove("hidden");
      });
    }

    function logout() {
      document.getElementById("loginModal").classList.remove("hidden");
      document.getElementById("passwordInput").value = "";
    }

    function populateDays() {
      const daySel = document.getElementById("daySelect");
      daySel.innerHTML = "";
      for (let i = 1; i <= 31; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Tanggal ${i}`;
        daySel.appendChild(opt);
      }
    }

    function autoSelectToday() {
      const now = new Date();
      const day = now.getDate();
      document.getElementById("daySelect").value = day <= 31 ? day : 1;
    }

    // 2. FUNGSI PEMANGGIL DATA SISWA & REKAP DARI SHEETS
    function loadStudentCards() {
      const month = document.getElementById("monthSelect").value;
      const container = document.getElementById("studentCardsContainer");
      container.innerHTML = `
        <div class="col-span-full text-center py-12 text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-600"></i>
          <p>Memuat data presensi bulan <strong>${month}</strong>...</p>
        </div>`;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getStudents", month: month })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          currentStudents = res.students;
          attendanceState = {};
          res.students.forEach(s => attendanceState[s.nis] = "H");
          renderCards();
        } else {
          container.innerHTML = `<div class="col-span-full text-center text-red-500 py-6">Gagal memuat data dari Sheets.</div>`;
        }
      })
      .catch(err => {
        container.innerHTML = `<div class="col-span-full text-center text-red-500 py-6">Error: ${err.message}</div>`;
      });
    }

    function renderCards() {
      const container = document.getElementById("studentCardsContainer");
      if (currentStudents.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500">Belum ada siswa terdaftar. Gunakan menu Edit/Tambah Siswa.</div>`;
        return;
      }

      container.innerHTML = currentStudents.map(s => {
        const hasWarning = parseInt(s.alfa) > 0 || parseInt(s.cabut) > 0;
        const currentStatus = attendanceState[s.nis] || "H";

        return `
          <div class="bg-white rounded-2xl p-4 border ${hasWarning ? 'border-red-300 shadow-red-50' : 'border-slate-200'} shadow-sm transition relative flex flex-col justify-between">
            ${hasWarning ? `<span class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow"><i class="fa-solid fa-triangle-exclamation"></i> Perhatian</span>` : ''}
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-md">No. ${s.no}</span>
                <span class="text-xs font-semibold px-2 py-0.5 ${s.lp === 'L' ? 'bg-blue-50 text-blue-600' : 'bg-pink-50 text-pink-600'} rounded-md">${s.lp === 'L' ? 'Laki-Laki' : 'Perempuan'}</span>
              </div>
              <h3 class="font-bold text-slate-800 text-base leading-snug">${s.nama}</h3>
              <p class="text-xs text-slate-400 mb-3">NIS: ${s.nis}</p>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl text-xs flex justify-between items-center mb-3 border border-slate-100">
              <div><span class="text-slate-400">%H:</span> <strong class="text-slate-700">${s.persen}</strong></div>
              <div><span class="text-slate-400">Alfa:</span> <strong class="${s.alfa > 0 ? 'text-red-600 font-bold' : 'text-slate-600'}">${s.alfa}</strong></div>
              <div><span class="text-slate-400">Cabut:</span> <strong class="${s.cabut > 0 ? 'text-purple-600 font-bold' : 'text-slate-600'}">${s.cabut}</strong></div>
            </div>
            <div class="grid grid-cols-5 gap-1">
              ${['H', 'S', 'I', 'A', 'C'].map(st => `
                <button type="button" onclick="setStatus('${s.nis}', '${st}')" 
                        class="status-btn py-2 text-xs font-bold rounded-lg border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition ${currentStatus === st ? 'active-' + st : ''}">
                  ${st}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function setStatus(nis, status) {
      attendanceState[nis] = status;
      renderCards();
    }

    function setAllHadir() {
      currentStudents.forEach(s => attendanceState[s.nis] = "H");
      renderCards();
    }

    // 3. FUNGSI PEMANGGIL PENYIMPANAN PRESENSI HARIAN KE SHEETS
    function saveAttendance() {
      const month = document.getElementById("monthSelect").value;
      const day = document.getElementById("daySelect").value;
      const btn = document.getElementById("btnSave");

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Menyimpan...`;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "saveAttendance", month: month, day: day, attendanceMap: attendanceState })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Simpan Presensi Harian`;
        if (res.success) {
          playSuccessSound();
          showToast(`Presensi Tgl ${day} ${month} berhasil disimpan ke Sheets!`);
          loadStudentCards();
        } else {
          alert("Gagal menyimpan: " + res.message);
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Simpan Presensi Harian`;
        alert("Error: " + err.message);
      });
    }

    // 4. FUNGSI PEMANGGIL SCAN BARCODE / KETIK NIS KE SHEETS
    function updateScannerInfo() {
      const month = document.getElementById("monthSelect").value;
      const day = document.getElementById("daySelect").value;
      document.getElementById("scannerActiveDateInfo").textContent = `${month} - Tgl ${day}`;
    }

    function submitQuickNis() {
      const input = document.getElementById("quickNisInput");
      const nis = input.value.trim();
      if (!nis) return;

      const month = document.getElementById("monthSelect").value;
      const day = document.getElementById("daySelect").value;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "scanNis", month: month, day: day, nis: nis })
      })
      .then(res => res.json())
      .then(res => {
        const resCard = document.getElementById("scanResultCard");
        const resText = document.getElementById("scanResultText");
        const resIcon = document.getElementById("scanResultIcon");
        
        resCard.classList.remove("hidden");

        if (res.success) {
          resCard.className = "p-4 rounded-xl mb-4 text-sm font-bold flex items-center justify-center gap-3 bg-emerald-50 border border-emerald-300 text-emerald-800 shadow-md";
          resIcon.className = "fa-solid fa-circle-check text-2xl text-emerald-600";
          resText.innerHTML = `BERHASIL! <strong>${res.nama}</strong> tercatat <strong>HADIR (H)</strong>.`;
          playSuccessSound();
          showToast(res.message);
        } else {
          resCard.className = "p-4 rounded-xl mb-4 text-sm font-bold flex items-center justify-center gap-3 bg-red-50 border border-red-300 text-red-800 shadow-md";
          resIcon.className = "fa-solid fa-triangle-exclamation text-2xl text-red-600";
          resText.innerHTML = `GAGAL! ${res.message}`;
          playErrorSound();
        }

        input.value = "";
        input.focus();

        setTimeout(() => {
          resCard.classList.add("hidden");
        }, 4000);
      })
      .catch(err => {
        alert("Error koneksi API: " + err.message);
        input.value = "";
        input.focus();
      });
    }

    // 5. FUNGSI PEMANGGIL MANAJEMEN / UPDATE SISWA KE SHEETS
    function openStudentModal() {
      document.getElementById("studentModal").classList.remove("hidden");
      const tbody = document.getElementById("studentEditTbody");
      tbody.innerHTML = "";
      currentStudents.forEach((s, idx) => appendStudentRow(idx + 1, s.nis, s.nama, s.lp));
    }

    function closeStudentModal() {
      document.getElementById("studentModal").classList.add("hidden");
    }

    function addStudentRow() {
      const tbody = document.getElementById("studentEditTbody");
      appendStudentRow(tbody.rows.length + 1, "", "", "L");
    }

    function appendStudentRow(no, nis, nama, lp) {
      const tbody = document.getElementById("studentEditTbody");
      const tr = document.createElement("tr");
      tr.className = "border-b hover:bg-slate-100 transition";
      tr.innerHTML = `
        <td class="p-2 text-center font-bold text-slate-500 row-no">${no}</td>
        <td class="p-2"><input type="text" value="${nis}" class="w-full px-2 py-1 border rounded text-xs input-nis" placeholder="NIS"></td>
        <td class="p-2"><input type="text" value="${nama}" class="w-full px-2 py-1 border rounded text-xs input-nama" placeholder="Nama"></td>
        <td class="p-2 text-center">
          <select class="px-2 py-1 border rounded text-xs input-lp">
            <option value="L" ${lp === 'L' ? 'selected' : ''}>L</option>
            <option value="P" ${lp === 'P' ? 'selected' : ''}>P</option>
          </select>
        </td>
        <td class="p-2 text-center">
          <button type="button" onclick="this.closest('tr').remove(); renumberRows();" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    }

    function renumberRows() {
      document.querySelectorAll("#studentEditTbody tr").forEach((tr, idx) => {
        tr.querySelector(".row-no").textContent = idx + 1;
      });
    }

    function saveStudentChanges() {
      const rows = document.querySelectorAll("#studentEditTbody tr");
      const newList = [];
      for (let i = 0; i < rows.length; i++) {
        const nis = rows[i].querySelector(".input-nis").value.trim();
        const nama = rows[i].querySelector(".input-nama").value.trim();
        const lp = rows[i].querySelector(".input-lp").value;
        if (!nis || !nama) {
          alert(`Baris ke-${i+1}: NIS dan Nama tidak boleh kosong!`);
          return;
        }
        newList.push({ no: i + 1, nis: nis, nama: nama, lp: lp });
      }

      const btn = document.getElementById("btnSaveStudents");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...`;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "updateStudents", students: newList })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerHTML = `Simpan Perubahan Siswa`;
        if (res.success) {
          closeStudentModal();
          showToast("Data siswa berhasil diperbarui di Google Sheets!");
          loadStudentCards();
        } else {
          alert("Gagal memperbarui siswa.");
        }
      })
      .catch(err => {
        btn.disabled = false;
        btn.innerHTML = `Simpan Perubahan Siswa`;
        alert("Error: " + err.message);
      });
    }

    // 6. RENDER ID CARDS & AUDIO EFFECTS
    function renderIdCards() {
      const container = document.getElementById("printableIdCards");
      if (currentStudents.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500">Belum ada siswa.</div>`;
        return;
      }
      container.innerHTML = currentStudents.map(s => `
        <div class="bg-white rounded-2xl p-5 border-2 border-slate-200 shadow-md relative flex flex-col justify-between w-full max-w-sm mx-auto overflow-hidden">
          <div class="absolute top-0 left-0 right-0 h-3 bg-blue-600"></div>
          <div class="text-center border-b border-slate-100 pb-3 mb-3 pt-1">
            <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">SD Negeri 1 Sirah Pulau Padang</h4>
            <h3 class="text-base font-extrabold text-blue-900 leading-tight">KARTU PELAJAR KELAS 5.B</h3>
            <p class="text-[10px] text-slate-500">Tahun Ajaran 2026/2027</p>
          </div>
          <div class="flex items-center justify-between gap-3 my-2">
            <div>
              <span class="text-[10px] font-bold px-2 py-0.5 bg-slate-100 text-slate-600 rounded">No. ${s.no}</span>
              <h2 class="font-bold text-slate-800 text-lg mt-1 leading-snug">${s.nama}</h2>
              <p class="text-xs font-mono font-semibold text-blue-600 mt-0.5">NIS: ${s.nis}</p>
              <span class="inline-block mt-2 text-[10px] font-bold px-2 py-0.5 ${s.lp === 'L' ? 'bg-blue-50 text-blue-700' : 'bg-pink-50 text-pink-700'} rounded">
                ${s.lp === 'L' ? 'Laki-Laki' : 'Perempuan'}
              </span>
            </div>
            <div class="p-2 bg-white border border-slate-200 rounded-xl shadow-sm flex items-center justify-center">
              <div id="qrcode-${s.nis}" class="w-24 h-24 flex items-center justify-center"></div>
            </div>
          </div>
          <div class="border-t border-slate-100 pt-3 mt-2 flex justify-between items-end text-[10px] text-slate-500">
            <div>
              <p>Wali Kelas,</p>
              <p class="font-bold text-slate-800 mt-3">Pak M. Deri Juniko, S.Pd., Gr.</p>
            </div>
            <div class="text-right">
              <span class="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-[9px]">ID-${s.nis}</span>
            </div>
          </div>
        </div>
      `).join('');

      currentStudents.forEach(s => {
        const el = document.getElementById(`qrcode-${s.nis}`);
        if (el) {
          el.innerHTML = "";
          new QRCode(el, {
            text: String(s.nis),
            width: 88,
            height: 88,
            colorDark: "#1F4E78",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      });
    }

    function playSuccessSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function playErrorSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toastMsg").textContent = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      toast.classList.add("translate-y-0", "opacity-100");
      setTimeout(() => {
        toast.classList.remove("translate-y-0", "opacity-100");
        toast.classList.add("translate-y-20", "opacity-0");
      }, 3500);
    }
  </script>
